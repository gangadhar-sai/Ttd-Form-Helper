<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- iOS Cupertino Royal Blue Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A88FF"/>
      <stop offset="35%" stop-color="#0062E3"/>
      <stop offset="100%" stop-color="#002D80"/>
    </linearGradient>

    <!-- Glossy Specular Glass Reflection (Apple iOS style) -->
    <linearGradient id="glossHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Pure Sacred Gold Gradient for Jewelry, Shankha & Chakra -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5B8"/>
      <stop offset="30%" stop-color="#FFD700"/>
      <stop offset="70%" stop-color="#E69500"/>
      <stop offset="100%" stop-color="#A66300"/>
    </linearGradient>

    <!-- Divine Sri Choornam (Vibrant Sacred Red Tilakam) -->
    <linearGradient id="tilak" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF3823"/>
      <stop offset="40%" stop-color="#E00613"/>
      <stop offset="100%" stop-color="#8F0008"/>
    </linearGradient>

    <!-- Luminous Pristine White for Namam Prongs -->
    <linearGradient id="namamWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F4F8FD"/>
      <stop offset="100%" stop-color="#D5E4F7"/>
    </linearGradient>

    <!-- Divine Golden Halo Glow -->
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE885" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#FFBF00" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0062E3" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow Filter for Divine 3D Elevation -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#00143D" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- iOS App Icon Squircle Background -->
  <rect x="16" y="16" width="480" height="480" rx="106" fill="url(#bgGrad)"/>

  <!-- Divine Radial Aura behind Deity Symbols -->
  <circle cx="256" cy="256" r="185" fill="url(#halo)"/>

  <!-- Main Divine Composition with Elevation Shadow -->
  <g filter="url(#shadow)">

    <!-- ============================================================== -->
    <!-- 1. SACRED SUDARSHANA CHAKRA (Left Flank - Divine Fiery Discus) -->
    <!-- ============================================================== -->
    <g transform="translate(106, 252)">
      <!-- Radiant Flame Halo -->
      <circle cx="0" cy="0" r="50" fill="url(#gold)" opacity="0.2"/>

      <!-- 8 Outer Flame Spikes (Divine Fire / Jwala) -->
      <path d="M 0,-56 L 6,-42 L -6,-42 Z" fill="url(#gold)"/>
      <path d="M 0,56 L 6,42 L -6,42 Z" fill="url(#gold)"/>
      <path d="M -56,0 L -42,-6 L -42,6 Z" fill="url(#gold)"/>
      <path d="M 56,0 L 42,-6 L 42,6 Z" fill="url(#gold)"/>
      <path d="M -39,-39 L -28,-36 L -36,-28 Z" fill="url(#gold)"/>
      <path d="M 39,39 L 28,36 L 36,28 Z" fill="url(#gold)"/>
      <path d="M 39,-39 L 36,-28 L 28,-36 Z" fill="url(#gold)"/>
      <path d="M -39,39 L -36,28 L -28,36 Z" fill="url(#gold)"/>

      <!-- Outer Golden Rim with Diamond Studs -->
      <circle cx="0" cy="0" r="42" fill="none" stroke="url(#gold)" stroke-width="7"/>
      <circle cx="0" cy="0" r="34" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.8"/>

      <!-- Central Gem Hub & Spokes -->
      <circle cx="0" cy="0" r="14" fill="url(#gold)"/>
      <circle cx="0" cy="0" r="7" fill="#FFFFFF"/>
      <line x1="0" y1="-34" x2="0" y2="34" stroke="url(#gold)" stroke-width="3.5"/>
      <line x1="-34" y1="0" x2="34" y2="0" stroke="url(#gold)" stroke-width="3.5"/>
      <line x1="-24" y1="-24" x2="24" y2="24" stroke="url(#gold)" stroke-width="3.5"/>
      <line x1="24" y1="-24" x2="-24" y2="24" stroke="url(#gold)" stroke-width="3.5"/>
    </g>

    <!-- ============================================================== -->
    <!-- 2. SACRED PANCHAJANYA SHANKHA (Right Flank - Divine Holy Conch) -->
    <!-- ============================================================== -->
    <g transform="translate(406, 252)">
      <!-- Flame Halo -->
      <circle cx="0" cy="0" r="50" fill="url(#gold)" opacity="0.2"/>

      <!-- Top Golden Flame Crest -->
      <path d="M 0,-54 C 10,-44 14,-36 0,-28 C -14,-36 -10,-44 0,-54 Z" fill="url(#gold)"/>
      <path d="M -16,-46 C -6,-38 0,-34 -10,-24" fill="none" stroke="url(#gold)" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M 16,-46 C 6,-38 0,-34 10,-24" fill="none" stroke="url(#gold)" stroke-width="3.5" stroke-linecap="round"/>

      <!-- Holy Conch Shell Body (White with Golden Curves) -->
      <path d="M 0,-30
               C 28,-30 46,-10 46,18
               C 46,42 26,52 0,54
               C -18,54 -38,42 -40,24
               C -42,6 -26,-12 -6,-28 Z"
            fill="url(#namamWhite)"/>

      <!-- Conch Spirals & Volute Details -->
      <path d="M 8,-28 C 24,-16 26,12 10,34 C 0,48 -18,46 -24,28"
            fill="none" stroke="url(#gold)" stroke-width="4" stroke-linecap="round"/>
      <path d="M -4,-18 C 10,-8 12,12 0,26"
            fill="none" stroke="#A8C4EB" stroke-width="3" stroke-linecap="round"/>

      <!-- Lower Conch Tail Tip -->
      <path d="M -2,52 C -6,64 -12,74 -18,80 C -22,82 -24,76 -20,68 C -16,58 -10,48 -4,42"
            fill="url(#namamWhite)"/>
      <circle cx="-1" cy="-28" r="6" fill="url(#gold)"/>
    </g>

    <!-- ============================================================== -->
    <!-- 3. SACRED TIRUNAMAM (Center - Lord Venkateswara's Urdhva Pundra) -->
    <!-- ============================================================== -->
    <g transform="translate(256, 256)">

      <!-- Golden Kireetam / Crown Crest at Top -->
      <g transform="translate(0, -145)">
        <path d="M -44,0 Q 0,-26 44,0 L 32,16 Q 0,8 -32,16 Z" fill="url(#gold)"/>
        <!-- Central Gem on Crown -->
        <circle cx="0" cy="-6" r="9" fill="url(#gold)"/>
        <circle cx="0" cy="-6" r="5" fill="#FFFFFF"/>
        <circle cx="-24" cy="3" r="4.5" fill="#FFFFFF"/>
        <circle cx="24" cy="3" r="4.5" fill="#FFFFFF"/>
      </g>

      <!-- Sacred White Namam - LEFT WING (Smooth, open, upward-curved) -->
      <path d="M -20,-115
               C -35,-115 -58,-98 -68,-65
               C -78,-32 -76,18 -66,55
               C -56,92 -36,122 -16,142
               L -16,112
               C -30,95 -45,72 -52,45
               C -58,18 -58,-20 -50,-45
               C -42,-68 -28,-86 -20,-88
               Z"
            fill="url(#namamWhite)"/>

      <!-- Sacred White Namam - RIGHT WING (Symmetrical, open, upward-curved) -->
      <path d="M 20,-115
               C 35,-115 58,-98 68,-65
               C 78,-32 76,18 66,55
               C 56,92 36,122 16,142
               L 16,112
               C 30,95 45,72 52,45
               C 58,18 58,-20 50,-45
               C 42,-68 28,-86 20,-88
               Z"
            fill="url(#namamWhite)"/>

      <!-- Bottom U-Base joining the wings -->
      <path d="M -16,112
               C -16,132 -6,148 0,150
               C 6,148 16,132 16,112
               L 16,142
               C 12,154 6,160 0,162
               C -6,160 -12,154 -16,142
               Z"
            fill="url(#namamWhite)"/>

      <!-- Downward Peetham (Nose-bridge lotus petal tip) -->
      <path d="M -14,146
               C -14,166 0,188 0,188
               C 0,188 14,166 14,146
               C 8,154 -8,154 -14,146 Z"
            fill="url(#namamWhite)"/>

      <!-- ============================================================== -->
      <!-- Sacred Sri Choornam / Red Tilakam (The Central Goddess Lakshmi) -->
      <!-- ============================================================== -->
      <!-- Brilliant red vertical column running straight down the center -->
      <path d="M -8,-95
               L 8,-95
               C 8.5,-30 8,40 6.5,105
               C 5.5,135 3.5,160 0,172
               C -3.5,160 -5.5,135 -6.5,105
               C -8,40 -8.5,-30 -8,-95 Z"
            fill="url(#tilak)"/>

      <!-- Inner Luster Line on Tilakam -->
      <line x1="0" y1="-88" x2="0" y2="155" stroke="#FFA299" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>

      <!-- Sacred Golden Bindu / Tilakam Dot at Top -->
      <circle cx="0" cy="-105" r="5" fill="url(#gold)"/>
    </g>

    <!-- Bottom Golden Lotus Base -->
    <g transform="translate(256, 436)">
      <path d="M -80,-6 Q 0,18 80,-6 Q 0,12 -80,-6 Z" fill="url(#gold)"/>
      <circle cx="0" cy="4" r="5.5" fill="#FFFFFF"/>
      <circle cx="-32" cy="1" r="3.5" fill="url(#gold)"/>
      <circle cx="32" cy="1" r="3.5" fill="url(#gold)"/>
    </g>
  </g>

  <!-- iOS Specular Glass Glossy Curved Sheen -->
  <path d="M 16,120 C 16,62 62,16 120,16 L 392,16 C 450,16 496,62 496,120 C 496,135 480,155 420,165 C 290,190 180,215 16,170 Z"
        fill="url(#glossHighlight)"/>

  <!-- High-precision iOS App Icon Chamfer & Borders -->
  <rect x="17" y="17" width="478" height="478" rx="105" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="3"/>
  <rect x="20" y="20" width="472" height="472" rx="102" fill="none" stroke="#000000" stroke-opacity="0.1" stroke-width="2"/>
</svg>
